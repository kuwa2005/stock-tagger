# Stock Image Auto Tagger

services:
  stock-tagger:
    build: .
    image: stock-tagger:latest
    container_name: stock-tagger
    ports:
      # 既定はローカルホストのみで待ち受け（API に認証がないため）。
      # 他端末から使う場合はリバースプロキシ＋アクセス制限を推奨。
      # やむを得ず LAN に直接公開する場合のみ .env で BIND_ADDRESS=0.0.0.0 等を指定。
      - "${BIND_ADDRESS:-127.0.0.1}:${WEBUI_PORT:-7861}:7861"
    volumes:
      - ./data:/data
    environment:
      - HF_HOME=/data/hf_cache
      - CUDA_VISIBLE_DEVICES=0
      # USE_RAM=false で RAM++ を無効化（VRAM 節約時）
      - USE_RAM=${USE_RAM:-true}
      # 外部翻訳 API（MyMemory）へのキャプション送信。既定は無効
      - ENABLE_EXTERNAL_TRANSLATE=${ENABLE_EXTERNAL_TRANSLATE:-false}
      - PRELOAD_MODELS=${PRELOAD_MODELS:-true}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-50}
      - MAX_FILES_PER_REQUEST=${MAX_FILES_PER_REQUEST:-50}
      - MAX_KEYWORDS=${MAX_KEYWORDS:-20}
      - CAPTION_MAX_NEW_TOKENS=${CAPTION_MAX_NEW_TOKENS:-256}
      - CAPTION_NUM_BEAMS=${CAPTION_NUM_BEAMS:-3}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7861/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    restart: unless-stopped
